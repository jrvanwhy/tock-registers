[toolchain]
# This is tock-registers' Minimum Supported Rust Version (MSRV).
#
# Update policy: Before each major tock-registers version, we update this to the
# latest stable toolchain. Between major releases, we leave the MSRV as-is so
# that it does not block updates to newer minor and patch versions.
#
# Whenever the MSRV is updated, you should update the rust-version field in
# Cargo.toml and add any newly-available lints to tests/many_lints.rs.
channel = "1.99.1"
components = ["clippy", "rustfmt"]
